schema-version: 1

version:
  initial: 1.0.0
  anchor: refs/tags/v1.0.0

defaults:
  increment: Patch
  unknown-commit: ignore
  unknown-merge: error

git:
  traversal: first-parent
  source-identity: merge-message
  merge-message-formats:
    gitlab: "^Merge branch '(?P<source>[^']+)' into '(?P<target>[^']+)'"

  history:
    shallow: error
    missing-parent: error
    octopus: error
    squash: error
    rebase: error

tags:
  discovery: anchor-only
  create: false

branches:
  main:
    match: {exact: main}
    priority: 100
    increment: Patch
    core: {source: releases}
    prerelease: {enabled: false}
    rules:
      - id: release-develop
        priority: 100
        when:
          event: merge
          source: {roles: [develop]}
        actions:
          - release: {increment: Inherit, boundary: source-tip}

  develop:
    match: {exact: develop}
    priority: 100
    inherits: main
    increment: Inherit
    core: {source: next-release, of: main, increment: Inherit}
    prerelease:
      enabled: true
      label: beta
      counter:
        initial: 0
        origin: {kind: release-boundary, branch: main, projection: released-source-tip}
        rules:
          - id: beta-per-work-merge
            priority: 100
            when: {event: merge, source: {roles: [work]}}
            actions:
              - increment-counter: {by: 1}
        reset:
          on: release
          branch: main
          requires-source-role: develop
          value: 0
          preserve-pending-events: true

  work:
    # Include both "features" and the requested "featues" spelling; retain ci/*.
    match: {regex: '^(?P<kind>feat|feature|features|featues|fix|ci)/(?P<name>.+)$'}
    priority: 10
    inherits: develop
    increment: Inherit
    core: {source: branch-core, of: develop}
    prerelease:
      enabled: true
      label: '{kind}-{name}'
      counter:
        initial: 0
        origin: {kind: fork, branch: develop, algorithm: common-first-parent}
        rules:
          - id: work-per-direct-commit
            priority: 100
            when: {event: commit}
            actions:
              - increment-counter: {by: 1}

rules:
  evaluation: first-match
  scope-order: [branch, shared]
  no-match: {commit: ignore, recognized-merge: ignore}
  shared: []
output:
  default-format: json
  metadata: []
validation:
  unknown-keys: error
  ambiguous-branch-match: error
  ambiguous-rule-priority: error
  inheritance-cycle: error
  label-collision: error
