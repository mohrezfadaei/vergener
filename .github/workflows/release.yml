name: Test and publish image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: go test ./...
      - name: Race test
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Build executable
        run: go build -o vergener ./cmd/vergener
      - name: Build image
        run: docker build --tag vergener:ci .

  publish:
    needs: test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release tag and derive image tags
        id: release
        env:
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'Release tags must be vMAJOR.MINOR.PATCH without leading zeros' >&2
            exit 1
          fi
          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          if [[ ! "$REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo 'Invalid GitHub repository name' >&2
            exit 1
          fi
          image="ghcr.io/${REPOSITORY,,}"
          commit=$(git rev-parse --verify "refs/tags/${TAG}^{commit}")
          if ! git show-ref --verify --quiet refs/remotes/origin/main; then
            echo 'Full checkout must include origin/main' >&2
            exit 1
          fi
          if ! git rev-list --first-parent refs/remotes/origin/main | awk -v sha="$commit" '$0 == sha { found=1 } END { exit !found }'; then
            echo 'Release tag must point to a commit on the first-parent history of main' >&2
            exit 1
          fi
          version="${TAG#v}"
          {
            echo 'tags<<EOF'
            printf '%s\n' "$image:$version" "$image:$major.$minor" "$image:$major" "$image:$commit" "$image:latest"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f7ce87c1d6bead3e36075b2ce75da1f6cc28aaca # v3.9.0
      - uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@48aba3b46d1b1fec4febb7c5d0c644b249a11355 # v6.10.0
        with:
          context: .
          push: true
          tags: ${{ steps.release.outputs.tags }}
